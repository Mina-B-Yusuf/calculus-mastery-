<!doctype html><html lang="en"><head><meta charset="utf-8">

  </div>
  <div style="flex:1"></div>
  <button class="begin">Begin<small>Integration by Parts · ~12 min</small></button>
</div>
<nav class="nav">

  <a><span class="pill"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M13 3v4h4"/></svg></span>Exam</a>
  <a><span class="pill"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></span>More</a>
</nav>
